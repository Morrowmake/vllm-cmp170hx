#
# Fork code outside the fork's own packages.
#
# Fork Python code lives in vllm_sm80/ (shared) and in new files under
# vllm/models/<model>/nvidia/; fork native code in
# csrc/ampere_marlin/ and csrc/exl3/. An upstream-owned
# file carries at most registered ops and one call into those packages.
#
# Each entry is a known exception: a fork-owned file placed in upstream's tree
# (no `hunks`), or edits of an upstream-owned file that are more than such a
# call (`hunks`: fingerprints of its zero-context hunks, the first 12 hex digits
# of the sha256 of the hunk's -/+ lines). Every entry says why no extension
# point serves it, who removes it and how:
#
# - file: <path>
#   hunks: [<fingerprint>, ...]
#   reason: <why no extension point serves it>
#   owner: <who removes it>
#   removal: <how it is removed>
#
# Remove an entry in the change that removes its code.
exceptions:
- file: vllm/v1/worker/gpu/async_utils.py
  hunks: [659159ed35de, 2bd7c3af5842, b20fe5341bf9]
  reason: >-
    (659159ed35de) Bug fix inside the existing failed-inputs hunk of AsyncOutput: the GPU mask of failed tokens stays referenced until its host copy has run, so its memory cannot be reused before the copy reads it. vLLM has no hook for extra host copies in AsyncOutput, so the fix sits where the copy is. (2bd7c3af5842) The Apache-2.0 modification notice after the SPDX header, a comment line that every patched upstream file carries (tests/sm80/test_modification_notices.py). It belongs in the file it describes; no extension point can hold it.
    (b20fe5341bf9) Output-type registration wraps the existing copy event once after both output classes exist. The older failed-request-id hook runs per output after synchronization and cannot install producer-stream copies before that same event. Registration does not add a synchronization or a reply.
  owner: >-
    (659159ed35de) Qwen4Exp EXL3 support; (2bd7c3af5842) fork licence compliance
    (b20fe5341bf9) sm_80 distributed output checks
  removal: >-
    (659159ed35de) Remove when the failed-mask copy of AsyncOutput moves into vllm_sm80 behind a hook: an AsyncOutput extra-copy hook in vLLM (an upstream candidate), or a runner subclass that wraps AsyncOutput and owns the copy. (2bd7c3af5842) Delete the notice line in the change that removes the last fork edit of this file, so that it no longer differs from upstream.
    (b20fe5341bf9) Remove when upstream output classes provide copy-stream and pre-publication error hooks on the same existing event; retain nonreply-rank dispatch and default-neutral copy-event regressions.

