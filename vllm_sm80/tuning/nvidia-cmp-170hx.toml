# Size cut-offs of the sm_80 kernels on this card (vllm_sm80/tuning.py).
# The first rows are the values each served model ran with before the table
# existed (the former environment defaults or its launcher settings), so
# serving is unchanged; tuning replaces them row by row with measured values.
schema = "sm80-tuning/1"
card = "NVIDIA CMP 170HX"

# dense_gemm/thin_max_rows: largest M the sm_80 thin-M BF16 GEMM takes, per
# weight [gemm_n, gemm_k].

[[row]]
op = "dense_gemm"
param = "thin_max_rows"
key = {gemm_n = 128, gemm_k = 4096}
value = 32
evidence = "seed: VLLM_THIN_GEMM_MAX_TOKENS default 32; GLM-5.3-Flash TP4 shape inventory"

