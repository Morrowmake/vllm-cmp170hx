# mhc/decode_v2_max_rows: largest M of the sm_80 mHC decode kernel.
[[row]]
op = "mhc"
param = "decode_v2_max_rows"
key = {hidden = 4096, hc_mult = 4}
value = 32
evidence = "seed: VLLM_GLM5_DECODE_MHC_V2_MAX_TOKENS default 32; GLM-5.3-Flash"

# mhc/prefill_min_rows: smallest M of the sm_80 mHC pre-norm GEMM. Its gate sees
# no shape, so the row has an empty key.
[[row]]
op = "mhc"
param = "prefill_min_rows"
key = {}
value = 384
evidence = "seed: VLLM_GLM5_PREFILL_MIN_TOKENS=384, GLM-5.3-Flash settings (the only model with VLLM_GLM5_PREFILL_KERNELS)"

# moe_router/route_v2_max_rows: largest M of the fused router GEMV + top-k +
# alignment (at most 64).
[[row]]
op = "moe_router"
param = "route_v2_max_rows"
key = {n_experts = 288, top_k = 8, hidden = 4096}
value = 32
evidence = "seed: VLLM_GLM5_DECODE_MOE_ROUTE_V2_MAX_TOKENS default 32; GLM-5.3-Flash"

# moe_router/fused_route_max_rows: largest M of the fused decode routing; batches
# up to it are left unmasked by the MoE padding mask.
[[row]]
op = "moe_router"
param = "fused_route_max_rows"
key = {top_k = 8}
value = 8
evidence = "seed: VLLM_MOE_MASK_PADDING_MAX_TOKENS default 8; GLM-5.3-Flash"

# attention_prefill/sparse_mla_min_rows: smallest M of the sm_80 sparse-MLA prefill.
[[row]]
op = "attention_prefill"
param = "sparse_mla_min_rows"
key = {head_dim = 512}
value = 384
evidence = "seed: VLLM_GLM5_PREFILL_MIN_TOKENS=384, GLM-5.3-Flash settings"

# attention_prefill/sparse_mla_min_ctx: smallest cache length of the sm_80
# sparse-MLA prefill (default twice the index width).
[[row]]
op = "attention_prefill"
param = "sparse_mla_min_ctx"
key = {head_dim = 512, index_width = 2176}
value = 4352
evidence = "seed: VLLM_GLM5_SPARSE_MLA_MIN_CTX_MULT default 2.0 x 2176 index slots; GLM-5.3-Flash"

