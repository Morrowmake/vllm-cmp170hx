  why: vllm/sm80/kernels/kda/commit_plan.py _prepare_commit_plan_kernel is this kernel (same heuristics and parameters, launched at its call site in KDARecoverSSMCommitContext.commit with the upstream argument list) plus the null/filtered and zero-commit early exits and the masked, unclamped final-state column; recover.py's _kda_fold_plan_kernel replicates it; an upstream change here must be ported to both
